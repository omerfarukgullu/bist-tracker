services:
  - type: web
    name: bist-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --timeout 120: bazı yfinance çağrıları gunicorn'un 30s varsayılanını
    # aşabiliyor. Tam günlük analiz artık arka plan thread'inde çalışıyor
    # (bkz. app.api_refresh), bu yüzden daha uzun bir timeout'a gerek yok.
    startCommand: gunicorn app:app --timeout 120
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: REFRESH_TOKEN
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

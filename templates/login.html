{% extends "base.html" %}
{% block title %}{{ t('login_title') }} — BIST Tracker{% endblock %}
{% block content %}
  <div class="auth-wrap">
    <div class="card auth-card">
      <h1>{{ t('login_title') }}</h1>
      {% if error %}
        <p class="msg-error">{{ error }}</p>
      {% endif %}
      <form method="post" class="auth-form">
        <label class="field">
          <span>{{ t('field_username') }}</span>
          <input type="text" name="username" class="ticker-add-input auth-input" value="{{ username or '' }}" required autofocus autocomplete="username">
        </label>
        <label class="field">
          <span>{{ t('field_password') }}</span>
          <input type="password" name="password" class="ticker-add-input auth-input" required autocomplete="current-password">
        </label>
        <button type="submit" class="ticker-add-btn auth-submit">{{ t('login_btn') }}</button>
      </form>
      <p class="muted small auth-switch">{{ t('login_no_account') }} <a href="{{ url_for('register') }}">{{ t('register_title') }}</a></p>
    </div>
  </div>
{% endblock %}

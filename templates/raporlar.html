{% extends "base.html" %}
{% block title %}{{ t('reports_title') }} — BIST Tracker{% endblock %}
{% block content %}
  <h1>{{ t('reports_title') }}</h1>
  {% if not files %}
    <p class="muted">{{ t('no_reports') }}</p>
  {% else %}
    <ul class="report-list">
      {% for f in files %}
        <li><a href="{{ url_for('rapor_detail', filename=f) }}">{{ f }}</a></li>
      {% endfor %}
    </ul>
  {% endif %}
{% endblock %}

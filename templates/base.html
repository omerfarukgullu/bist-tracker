<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    })();
  </script>
  <title>{% block title %}BIST Tracker{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">BT</span>
      <span class="brand-text">{{ t('brand_text') }}</span>
    </a>
    <nav>
      {% if current_user.is_authenticated %}
        <a href="{{ url_for('index') }}">{{ t('nav_panel') }}</a>
        <a href="{{ url_for('raporlar_list') }}">{{ t('nav_reports') }}</a>
        <span class="nav-username">{{ current_user.username }}</span>
        <a href="{{ url_for('logout') }}">{{ t('nav_logout') }}</a>
      {% else %}
        <a href="{{ url_for('login') }}">{{ t('nav_login') }}</a>
        <a href="{{ url_for('register') }}">{{ t('nav_register') }}</a>
      {% endif %}
      <a href="{{ url_for('set_lang', lang_code='en' if lang == 'tr' else 'tr') }}" class="lang-toggle-btn" title="{{ t('lang_toggle') }}" aria-label="{{ t('lang_toggle') }}">
        {{ 'EN' if lang == 'tr' else 'TR' }}
      </a>
      <button type="button" id="theme-toggle" class="theme-toggle-btn" aria-label="{{ t('theme_toggle') }}" title="{{ t('theme_toggle') }}">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <line x1="12" y1="2" x2="12" y2="4"></line>
          <line x1="12" y1="20" x2="12" y2="22"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="2" y1="12" x2="4" y2="12"></line>
          <line x1="20" y1="12" x2="22" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
</body>
</html>

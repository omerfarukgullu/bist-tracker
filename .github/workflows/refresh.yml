name: Günlük Analizi Tetikle

on:
  schedule:
    # Borsa İstanbul açılışından kısa süre sonra (TR saati UTC+3, DST yok) — 07:05 UTC = 10:05 TR
    - cron: "5 7 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: /api/refresh çağır
        run: |
          curl -sf -X POST "${{ secrets.REFRESH_URL }}" \
            -H "Authorization: Bearer ${{ secrets.REFRESH_TOKEN }}"
